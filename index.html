<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSong Drum Pattern Previewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1, h2 { color: #bb86fc; }
        .upload-section {
            border: 2px dashed #333;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #252525;
        }
        input[type="file"] { color: #fff; }
        .meta-info {
            display: flex;
            gap: 20px;
            background: #2a2a2a;
            padding: 12px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .pattern-container {
            margin-bottom: 24px;
            background: #252525;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #333;
            padding: 6px;
            text-align: center;
            font-size: 12px;
        }
        th { background: #333; color: #fff; }
        td.instrument-name {
            text-align: left;
            font-weight: bold;
            color: #03dac6;
            background: #222;
        }
        .step-active {
            background-color: #bb86fc;
            color: #121212;
            font-weight: bold;
        }
        .step-inactive {
            background-color: #1a1a1a;
            color: #555;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #9965f4; }
    </style>
</head>
<body>

<div class="container">
    <h1>OpenSong Drum Pattern Previewer</h1>
    
    <div class="upload-section">
        <label for="jsonFile">Upload or select a JSON drum pattern file: </label><br><br>
        <input type="file" id="jsonFile" accept=".json">
    </div>

    <div id="previewArea" style="display:none;">
        <div class="meta-info">
            <div><strong>Song Name:</strong> <span id="songName">-</span></div>
            <div><strong>Time Signature:</strong> <span id="timeSig">-</span></div>
        </div>

        <div class="controls">
            <button id="playBtn">▶ Play Main Pattern</button>
        </div>

        <div id="patternsOutput"></div>
    </div>
</div>

<script>
    let currentData = null;
    let audioCtx = null;

    document.getElementById('jsonFile').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                currentData = JSON.parse(e.target.result);
                renderPreview(currentData);
            } catch (err) {
                alert("Invalid JSON file format!");
                console.error(err);
            }
        };
        reader.readAsText(file);
    });

    function renderPreview(data) {
        document.getElementById('previewArea').style.display = 'block';
        document.getElementById('songName').textContent = data.name || "Unnamed";
        document.getElementById('timeSig').textContent = `${data.beats} / ${data.divisions || 4}`;

        const container = document.getElementById('patternsOutput');
        container.innerHTML = '';

        const patternTypes = [
            { key: 'mainPattern', title: 'Main Pattern' },
            { key: 'variationPattern', title: 'Variation Pattern' },
            { key: 'fillMainPattern', title: 'Fill (Main)' },
            { key: 'fillVariationPattern', title: 'Fill (Variation)' }
        ];

        patternTypes.forEach(pt => {
            if (!data[pt.key]) return;

            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'pattern-container';
            sectionDiv.innerHTML = `<h2>${pt.title}</h2>`;

            const table = document.createElement('table');
            const tracks = data[pt.key];
            const trackNames = Object.keys(tracks);
            const stepCount = tracks[trackNames[0]] ? tracks[trackNames[0]].length : 16;

            // Header row (steps)
            let headerHtml = '<tr><th>Instrument</th>';
            for (let i = 0; i < stepCount; i++) {
                headerHtml += `<th>${i + 1}</th>`;
            }
            headerHtml += '</tr>';
            table.innerHTML = headerHtml;

            // Instrument rows
            trackNames.forEach(instrument => {
                const steps = tracks[instrument];
                // Skip completely empty instruments to keep UI clean, or show all:
                let rowHtml = `<tr><td class="instrument-name">${instrument}</td>`;
                for (let i = 0; i < stepCount; i++) {
                    const val = steps[i] || 0;
                    if (val > 0) {
                        rowHtml += `<td class="step-active" title="Velocity: ${val}">${val}</td>`;
                    } else {
                        rowHtml += `<td class="step-inactive">-</td>`;
                    }
                }
                rowHtml += '</tr>';
                table.innerHTML += rowHtml;
            });

            sectionDiv.appendChild(table);
            container.appendChild(sectionDiv);
        });
    }

    // Basic Web Audio synthesizer to preview rhythm clicks
    document.getElementById('playBtn').addEventListener('click', () => {
        if (!currentData) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const mainP = currentData.mainPattern;
        const steps = mainP['Kick'].length;
        const tempo = 120; // BPM assumption for preview
        const stepTime = (60 / tempo) / 4; // 16th note duration

        let startTime = audioCtx.currentTime;

        for (let i = 0; i < steps; i++) {
            let time = startTime + (i * stepTime);

            // Trigger Kick if velocity > 0
            if (mainP['Kick'] && mainP['Kick'][i] > 0) {
                playSynthDrum(time, 150, 0.05, 0.5);
            }
            // Trigger Snare
            if (mainP['Snare'] && mainP['Snare'][i] > 0) {
                playSynthNoise(time, 0.08, 0.3);
            }
            // Trigger HiHat
            if (mainP['HatClosed'] && mainP['HatClosed'][i] > 0) {
                playSynthNoise(time, 0.03, 0.1, 8000);
            }
        }
    });

    function playSynthDrum(time, freq, duration, volume) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + duration);
        gain.gain.setValueAtTime(volume, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + duration);
    }

    function playSynthNoise(time, duration, volume, filterFreq = 1000) {
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = filterFreq;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(volume, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start(time);
    }
</script>

</body>
</html>
